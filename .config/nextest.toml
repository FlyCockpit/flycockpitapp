[profile.default]
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "fail"
slow-timeout = { period = "60s", terminate-after = 2 }

# `cargo test` runs this module in one process, where its mutex serializes the
# live daemon/provider fixtures. Nextest gives each test its own process, so
# enforce the same isolation here without slowing the rest of the workspace.
[test-groups.daemon-lifecycle-replay]
max-threads = 1

[[profile.default.overrides]]
filter = "package(cockpit-cli) & binary(e2e) & test(/daemon_lifecycle_replay/)"
test-group = "daemon-lifecycle-replay"

# Broadcast lag marker drains a full in-process queue; cargo test ~2min.
[[profile.default.overrides]]
filter = "test(=daemon::server::tests::in_process_full_event_queue_emits_lag_marker)"
slow-timeout = { period = "90s", terminate-after = 3 }

# Socket-per-cell authz matrix; ~2min once every controlled kind is covered.
[[profile.default.overrides]]
filter = "test(=daemon::server::tests::authz_dispatch_matrix_covers_every_controlled_kind)"
slow-timeout = { period = "90s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "test(=daemon::server::tests::authz_default_profile_owner_traverses_every_controlled_socket_path)"
slow-timeout = { period = "90s", terminate-after = 4 }

# Multi-scenario retraction acceptance against a live worker and scripted
# provider streams; each boundary waits on real idle/tool events.
[[profile.default.overrides]]
filter = "test(=daemon::server::tests::cancel_turn_rpc_retracts_only_reasoning_only_real_worker_turns)"
slow-timeout = { period = "90s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "test(=daemon::server::tests::dispatch_matrix_mutating_dispatch_cases_traverse_socket_path)"
slow-timeout = { period = "90s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "test(=daemon::server::tests::dispatch_matrix_readonly_cases_traverse_socket_path)"
slow-timeout = { period = "90s", terminate-after = 4 }

# Detached IsolatedHome boot applies 0001 + vault before accept; the
# handshake wait is driven by the daemon's pid liveness and socket hello, not
# a wall-clock budget, so a slow (fsync-bound) boot on a loaded machine is
# patient rather than flaky. Every e2e test boots at least one detached
# daemon, so the whole binary gets the same slow-test budget: boot alone can
# exceed the default 120s kill window under full-workspace IO saturation.
[[profile.default.overrides]]
filter = "package(cockpit-cli) & binary(e2e)"
slow-timeout = { period = "90s", terminate-after = 3 }

# Two sequential vault-backed provider wizards; first apply is ~60s.
[[profile.default.overrides]]
filter = "test(=commands::setup::tests::baseten_provider_wizard_materializes_secret_reference)"
slow-timeout = { period = "90s", terminate-after = 3 }

# The pointer action registry opens a fresh settings dialog for every rendered
# category descriptor. Its exhaustive inventory grew beyond the default 120s
# wall-clock budget; keep all coverage active with an explicit contract-test
# timeout.
[[profile.default.overrides]]
filter = "test(=tui::settings::pointer_acceptance_tests::settings_pointer_action_registry_is_exhaustive_and_operable)"
slow-timeout = { period = "90s", terminate-after = 4 }

# Inner-loop profile for iterative agent runs. Skips only apps/cli's
# integration-test binary (`kind(test)`), which spawns the real `cockpit`
# binary and live daemons — the most expensive link + runtime in the
# workspace. Unit tests in apps/cli and every other crate still run.
# The default profile (used by CI and the final pre-completion gate)
# runs everything.
[profile.quick]
default-filter = "not (package(cockpit-cli) & kind(test))"
