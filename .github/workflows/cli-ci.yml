---
name: CLI CI

"on":
  push:
    branches:
      - main
      - master
    paths:
      - "apps/cli/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "apps/cli/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  gates:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-8vcpu-ubuntu-2404
            toolchain: stable
          - os: blacksmith-6vcpu-macos-latest
            toolchain: stable
          - os: blacksmith-8vcpu-windows-2025
            toolchain: stable
          - os: blacksmith-8vcpu-ubuntu-2404
            # Keep this pinned to apps/cli/Cargo.toml's rust-version.
            toolchain: 1.95.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install MSRV Rust
        if: matrix.toolchain == '1.95.0'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.toolchain }}
          workspaces: . -> target

      # macOS exposes `/var` as an alias for `/private/var`. Use the short,
      # physical system temp root: it keeps lexical and canonical paths equal
      # without exceeding the Unix-domain socket path limit in daemon tests.
      - name: Normalize macOS temporary directory
        if: contains(matrix.os, 'macos')
        run: echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"

      - name: Build
        if: contains(matrix.os, 'windows') == false
        run: cargo build --locked --workspace

      - name: Build Windows target
        if: contains(matrix.os, 'windows')
        run: cargo build --locked --workspace --target x86_64-pc-windows-msvc

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The dependency-inventory test intentionally resolves every supported
      # target with `--offline`; a host build fetches only its own target's
      # optional crates. Populate the registry cache on every test runner.
      - name: Fetch cross-platform metadata dependencies
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-unknown-linux-gnu

      - name: Test
        run: cargo nextest run --locked --workspace

      - name: Check released migrations are append-only
        run: bash scripts/check-append-only-migrations.sh

      - name: Doc tests
        run: cargo test --locked --workspace --doc

      - name: Clippy
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --tests -- -D warnings

      - name: Clippy Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --tests --target x86_64-pc-windows-msvc -- -D warnings

      - name: Clippy examples
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --examples -- -D warnings

      - name: Clippy examples Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --examples --target x86_64-pc-windows-msvc -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check
