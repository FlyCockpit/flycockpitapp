---
name: CLI CI

"on":
  push:
    branches:
      - main
      - master
    paths:
      - "apps/cli/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "apps/cli/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  gates:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-8vcpu-ubuntu-2404
            toolchain: stable
          - os: blacksmith-6vcpu-macos-latest
            toolchain: stable
          - os: blacksmith-8vcpu-windows-2025
            toolchain: stable
          - os: blacksmith-8vcpu-ubuntu-2404
            # Keep this pinned to apps/cli/Cargo.toml's rust-version.
            toolchain: 1.95.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install MSRV Rust
        if: matrix.toolchain == '1.95.0'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.toolchain }}
          workspaces: . -> target

      # macOS exposes `/var` as an alias for `/private/var`. Use the short,
      # physical system temp root: it keeps lexical and canonical paths equal
      # without exceeding the Unix-domain socket path limit in daemon tests.
      - name: Normalize macOS temporary directory
        if: contains(matrix.os, 'macos')
        run: echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"

      - name: Build
        if: contains(matrix.os, 'windows') == false
        run: cargo build --locked --workspace

      - name: Verify remote Noise dependency and binding policy
        run: node crates/cockpit-noise/scripts/verify-policy.mjs

      - name: Build Windows target
        if: contains(matrix.os, 'windows')
        run: cargo build --locked --workspace --target x86_64-pc-windows-msvc

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The dependency-inventory test intentionally resolves every supported
      # target with `--offline`; a host build fetches only its own target's
      # optional crates. Populate the registry cache on every test runner.
      - name: Fetch cross-platform metadata dependencies
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-unknown-linux-gnu

      - name: Test
        run: cargo nextest run --locked --workspace

      - name: Run deterministic Noise-C conformance corpus
        if: contains(matrix.os, 'ubuntu') && matrix.toolchain == '1.95.0'
        run: cargo nextest run --locked -p cockpit-noise --features test-entropy

      - name: Check released migrations are append-only
        run: bash scripts/check-append-only-migrations.sh

      - name: Doc tests
        run: cargo test --locked --workspace --doc

      - name: Clippy
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --tests -- -D warnings

      - name: Clippy Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --tests --target x86_64-pc-windows-msvc -- -D warnings

      - name: Clippy examples
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --examples -- -D warnings

      - name: Clippy examples Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --examples --target x86_64-pc-windows-msvc -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  noise-bindings:
    name: Remote Noise binding reproducibility
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust and WASM target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned binding tools
        run: |
          cargo install --locked wasm-bindgen-cli --version 0.2.126
          cargo install --locked wasm-pack --version 0.13.1
          cargo install --locked uniffi_bindgen --version 0.29.4
      - name: Verify dependency policy
        run: node crates/cockpit-noise/scripts/verify-policy.mjs
      - name: Build browser binding twice
        run: |
          wasm-pack build crates/cockpit-noise --target web --out-dir ../../packages/cockpit-noise-wasm/generated-a --no-default-features --features wasm
          wasm-pack build crates/cockpit-noise --target web --out-dir ../../packages/cockpit-noise-wasm/generated-b --no-default-features --features wasm
          node crates/cockpit-noise/scripts/compare-generated.mjs packages/cockpit-noise-wasm/generated-a packages/cockpit-noise-wasm/generated-b
      - name: Check native binding surface
        run: cargo check --locked -p cockpit-noise --no-default-features --features native-bindings
