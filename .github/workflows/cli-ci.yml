---
name: CLI CI

"on":
  push:
    branches:
      - main
      - master
    paths:
      - "apps/cli/**"
      - "apps/tenant-authority/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Supply-chain gates (issue #306): advisory/license/ban policy and the
      # CI-wired guardrail scripts must re-run when their config changes.
      - "deny.toml"
      - "scripts/check-production-secret-opens.sh"
      - "scripts/check-advisory-exceptions.sh"
      - "scripts/check-unsafe-safety-comments.sh"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/ci-runners.yml"
  pull_request:
    paths:
      - "apps/cli/**"
      - "apps/tenant-authority/**"
      - "crates/**"
      # Rust tests read the shared cross-language protocol fixtures, so a
      # change to them must trigger the Rust gate as well as the TS one.
      - "packages/cockpit-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Supply-chain gates (issue #306): advisory/license/ban policy and the
      # CI-wired guardrail scripts must re-run when their config changes.
      - "deny.toml"
      - "scripts/check-production-secret-opens.sh"
      - "scripts/check-advisory-exceptions.sh"
      - "scripts/check-unsafe-safety-comments.sh"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/ci-runners.yml"
  # Weekly advisory sweep (issue #306): RustSec advisories and yanks can land
  # against an UNCHANGED Cargo.lock, so path-filtered push/PR runs would leave
  # main green indefinitely while shipping a vulnerable lockfile. Scheduled
  # runs ignore the paths filters above and run on the default branch; the
  # heavy build jobs below opt out via `github.event_name != 'schedule'`, so
  # the sweep runs the supply-chain gate (audit + deny + exception expiry)
  # without paying for the full matrix.
  schedule:
    - cron: "0 6 * * MON"
  workflow_dispatch:
    inputs:
      remote_conformance:
        description: Run opt-in FlyCockpit remote/TURN/custody conformance jobs
        required: false
        default: false
        type: boolean

concurrency:
  # Event name in the group keeps the weekly advisory sweep (schedule) from
  # canceling an in-progress push run on the same ref — cancel-in-progress
  # would otherwise silently replace the full gate with the light sweep.
  group: cli-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  runners:
    name: Select CI runners
    uses: ./.github/workflows/ci-runners.yml

  gates:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    needs: runners
    # The weekly scheduled run only needs the supply-chain sweep; the build
    # matrix re-validates unchanged code against an unchanged toolchain.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ needs.runners.outputs.ubuntu_large }}
            toolchain: stable
          - os: ${{ needs.runners.outputs.macos }}
            toolchain: stable
          - os: ${{ needs.runners.outputs.windows }}
            toolchain: stable
          - os: ${{ needs.runners.outputs.ubuntu_large }}
            # Keep this pinned to apps/cli/Cargo.toml's rust-version.
            toolchain: 1.95.0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Install MSRV Rust
        if: matrix.toolchain == '1.95.0'
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.toolchain }}
          workspaces: . -> target

      # macOS exposes `/var` as an alias for `/private/var`. Use the short,
      # physical system temp root: it keeps lexical and canonical paths equal
      # without exceeding the Unix-domain socket path limit in daemon tests.
      - name: Normalize macOS temporary directory
        if: contains(matrix.os, 'macos')
        run: echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"

      - name: Build
        if: contains(matrix.os, 'windows') == false
        run: cargo build --locked --workspace --exclude tenant-authority

      - name: Check generated runtime documentation
        run: python3 apps/cli/scripts/generate-runtime-docs.py --check

      - name: Build Windows target
        if: contains(matrix.os, 'windows')
        run: cargo build --locked --workspace --exclude tenant-authority --target x86_64-pc-windows-msvc

      - name: Install nextest
        # Pinned install-action: the shorthand @nextest tag is a moving ref
        # that bundles "latest action + latest cargo-nextest"; pin the action
        # by SHA (issue #306) and let the tool version float deliberately.
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest

      # The dependency-inventory test intentionally resolves every supported
      # target with `--offline`. Fetch the complete locked graph first: target
      # filters do not fetch every conditional package (for example Android
      # support crates retained by `cargo metadata`), which made an otherwise
      # hermetic inventory fail only on a cold runner.
      - name: Fetch cross-platform metadata dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          # `cargo metadata` includes Android-target package records too. Fetch
          # one Android target explicitly so its conditional support crates are
          # available to the audit's deliberately offline metadata invocation.
          cargo fetch --locked --target aarch64-linux-android

      - name: Test
        run: cargo nextest run --locked --workspace --exclude tenant-authority --no-default-features

      - name: Check released migrations are append-only
        run: bash scripts/check-append-only-migrations.sh

      - name: Check TUI database ownership boundary
        run: bash scripts/check-tui-db-boundary.sh

      - name: Check test assertion integrity
        run: bash scripts/check-test-assertion-integrity.sh

      - name: Check Code-root constructor inventory
        run: bash scripts/check-code-root-constructors.sh

      # Vault-open guardrail (issue #306): no CI job or hook ran this before;
      # it is now part of the serialized Rust gate on every leg.
      - name: Check production-path secret opens
        run: bash scripts/check-production-secret-opens.sh

      # SAFETY-comment ratchet (issue #306): the undocumented-unsafe-site count
      # may not grow past the ceiling recorded in the script.
      - name: Check unsafe SAFETY comment ratchet
        run: bash scripts/check-unsafe-safety-comments.sh

      - name: Doc tests
        run: cargo test --locked --workspace --exclude tenant-authority --doc

      - name: Clippy
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --exclude tenant-authority --tests --no-default-features -- -D warnings

      - name: Clippy Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --exclude tenant-authority --tests --no-default-features --target x86_64-pc-windows-msvc -- -D warnings

      - name: Clippy examples
        if: contains(matrix.os, 'windows') == false
        run: cargo clippy --locked --workspace --exclude tenant-authority --examples -- -D warnings

      - name: Clippy examples Windows target
        if: contains(matrix.os, 'windows')
        run: cargo clippy --locked --workspace --exclude tenant-authority --examples --target x86_64-pc-windows-msvc -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  supply-chain:
    name: Cargo audit + deny
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Prebuilt, checksum-verified binaries from GitHub Releases; versions
      # pinned and bumped deliberately (issue #306). The action itself is
      # SHA-pinned: this job is the supply-chain gate, so its entry path must
      # not run attacker-mutable action code (a moved @v2 tag could serve
      # audit/deny binaries that always pass). Dependabot's github-actions
      # ecosystem keeps the SHA current.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      # Exception policy gate (issue #306): every deny.toml [advisories].ignore
      # entry must carry a review-by date that has not passed, and the
      # cargo-audit --ignore flags are derived from that same array so audit
      # and deny can never drift. Outputs the flags for the audit step below.
      - name: Check advisory exception policy (expiry + audit flags)
        id: advisory-exceptions
        run: |
          flags="$(bash scripts/check-advisory-exceptions.sh)"
          echo "audit-flags=$flags" >> "$GITHUB_OUTPUT"

      # Fails on any RUSTSEC advisory affecting the locked graph except the
      # time-bounded, audited exceptions (owner decision 2026-09-01, issue
      # #306), with the ignore list mechanically derived from deny.toml.
      - name: cargo audit
        run: cargo audit ${{ steps.advisory-exceptions.outputs.audit-flags }}

      # Advisory, license, ban, and source policy against the whole locked
      # graph (all targets union, all features). New advisories outside the
      # deny.toml exceptions, off-allowlist licenses, yanked crates outside
      # the crate-spec exceptions in [advisories].ignore, any
      # OpenSSL/native-TLS outside the pinned firecrawl stack, and unknown
      # registries or git sources all fail (issue #306).
      - name: cargo deny
        run: cargo deny --config deny.toml check advisories bans licenses sources

  grok-subscription:
    name: SuperGrok subscription feature
    needs: runners
    if: github.event_name != 'schedule'
    runs-on: ${{ needs.runners.outputs.ubuntu_large }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: grok-subscription
          workspaces: . -> target

      - name: Install nextest
        # Pinned install-action: the shorthand @nextest tag is a moving ref
        # that bundles "latest action + latest cargo-nextest"; pin the action
        # by SHA (issue #306) and let the tool version float deliberately.
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest

      # Keep the retained implementation compiling and lint-clean even though
      # official release artifacts leave this feature disabled.
      - name: Build with SuperGrok subscription support
        run: cargo build --locked -p cockpit-cli --features grok-subscription

      - name: Test with SuperGrok subscription support
        run: >
          cargo nextest run --locked
          -p cockpit-core -p cockpit-tui -p cockpit-cli
          --features grok-subscription

      - name: Clippy with SuperGrok subscription support
        run: >
          cargo clippy --locked
          -p cockpit-core -p cockpit-tui -p cockpit-cli
          --features grok-subscription --tests -- -D warnings

  daemon-custody-pkcs11-softhsm:
    name: Daemon custody PKCS#11 (SoftHSM2)
    if: github.event_name == 'workflow_dispatch' && inputs.remote_conformance
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        # Pinned install-action: the shorthand @nextest tag is a moving ref
        # that bundles "latest action + latest cargo-nextest"; pin the action
        # by SHA (issue #306) and let the tool version float deliberately.
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest

      - name: Install and initialize SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
          conf="$RUNNER_TEMP/softhsm2.conf"
          tokens="$RUNNER_TEMP/softhsm-tokens"
          mkdir -p "$tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\n' "$tokens" > "$conf"
          export SOFTHSM2_CONF="$conf"
          softhsm2-util --init-token --slot 0 --label flycockpit --so-pin 123456 --pin 1234
          module="$(dpkg -L libsofthsm2 | grep -m1 'libsofthsm2\.so$')"
          {
            echo "SOFTHSM2_CONF=$conf"
            echo "COCKPIT_SOFTHSM_MODULE=$module"
            echo "COCKPIT_SOFTHSM_TOKEN_LABEL=flycockpit"
            echo "COCKPIT_SOFTHSM_USER_PIN=1234"
          } >> "$GITHUB_ENV"

      # Runs ONLY the #[ignore]d PKCS#11 conformance tests against the real
      # SoftHSM2 token, with the `daemon-custody-pkcs11` feature enabled. The
      # default serialized gate leaves these ignored, so it stays green without
      # SoftHSM installed. No `--locked`: this leg resolves the optional cryptoki
      # dependency.
      - name: Run PKCS#11 conformance (ignored-only)
        run: >
          cargo nextest run -p cockpit-core
          --features daemon-custody-pkcs11
          --run-ignored ignored-only
          -E 'test(remote_daemon_custody_pkcs11_softhsm)'

  turn-coturn-conformance:
    name: TURN client conformance (coturn)
    if: github.event_name == 'workflow_dispatch' && inputs.remote_conformance
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        # Pinned install-action: the shorthand @nextest tag is a moving ref
        # that bundles "latest action + latest cargo-nextest"; pin the action
        # by SHA (issue #306) and let the tool version float deliberately.
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest

      # The immutable digest keeps the conformance server binary reproducible.
      - name: Start pinned coturn (UDP/TCP/TLS, long-term credentials)
        env:
          COTURN_IMAGE: docker.io/coturn/coturn:4.6.2@sha256:4873c54f213ec81f6b4c4c4938b69c922f50b2293ded427f5191472b9a127227
          TURN_USER: turnuser
          TURN_PASS: turnpass
          TURN_TLS_SNI: localhost
        run: |
          set -euo pipefail
          show_coturn_logs() {
            echo "::group::coturn logs"
            docker logs coturn || true
            if [ -f "$logdir/turnserver.log" ]; then
              echo "::group::coturn server log"
              sed -n '1,400p' "$logdir/turnserver.log" || true
              echo "::endgroup::"
            fi
            echo "::endgroup::"
          }
          trap 'status=$?; show_coturn_logs; exit "$status"' ERR
          certdir="$RUNNER_TEMP/coturn-tls"
          logdir="$RUNNER_TEMP/coturn-logs"
          mkdir -p "$certdir"
          # coturn runs as `nobody`; its diagnostic file is visible only to
          # that container and this ephemeral runner job.
          install -d -m 733 "$logdir"
          # Build a proper short-lived private CA plus a server leaf.  A
          # self-signed leaf can pass an OpenSSL probe while being rejected by
          # rustls/WebPKI's server-auth validation, which would leave the real
          # TURN-over-TLS allocation path untested.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=Flycockpit coturn CI CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout "$certdir/ca-key.pem" -out "$certdir/ca-cert.pem"
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=$TURN_TLS_SNI" \
            -keyout "$certdir/key.pem" -out "$certdir/cert.csr"
          openssl x509 -req -days 2 \
            -in "$certdir/cert.csr" \
            -CA "$certdir/ca-cert.pem" -CAkey "$certdir/ca-key.pem" -CAcreateserial \
            -out "$certdir/cert.pem" \
            -extfile <(printf '%s\n' \
              "basicConstraints=critical,CA:FALSE" \
              "keyUsage=critical,digitalSignature,keyEncipherment" \
              "extendedKeyUsage=serverAuth" \
              "subjectAltName=DNS:$TURN_TLS_SNI,IP:127.0.0.1")
          # The pinned image runs turnserver as `nobody`. Make the ephemeral
          # fixture readable through its read-only bind mount; otherwise
          # coturn silently disables TLS after failing to open the keypair.
          chmod 755 "$certdir"
          chmod 644 "$certdir/cert.pem" "$certdir/key.pem"
          sudo cp "$certdir/ca-cert.pem" /usr/local/share/ca-certificates/coturn-test.crt
          sudo update-ca-certificates
          # coturn: long-term credential mechanism, one fixture user, no relay
          # to public ranges (denied-peer ACL exercised by the test).
          docker run -d --name coturn --network host \
            -v "$certdir:/tls:ro" -v "$logdir:/logs" "$COTURN_IMAGE" \
            -n --lt-cred-mech --fingerprint \
            --user "$TURN_USER:$TURN_PASS" \
            --realm localhost \
            --listening-port 3478 --tls-listening-port 5349 \
            --listening-ip 127.0.0.1 \
            --cert /tls/cert.pem --pkey /tls/key.pem \
            --log-file /logs/turnserver.log \
            --denied-peer-ip 0.0.0.0-0.255.255.255 \
            --no-multicast-peers
          # UDP port scans do not prove a listener is usable. Require both the
          # TCP TURN listener and a verified TLS handshake before running the
          # real-I/O conformance test.
          ready=false
          for _ in $(seq 1 30); do
            if nc -z -w 1 127.0.0.1 3478 2>/dev/null \
              && openssl s_client -brief \
                -connect "127.0.0.1:5349" \
                -servername "$TURN_TLS_SNI" \
                -verify_hostname "$TURN_TLS_SNI" \
                -verify_return_error \
                -CAfile "$certdir/ca-cert.pem" \
                </dev/null >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' coturn 2>/dev/null | grep -qx true; then
              echo "coturn exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "coturn did not become TCP/TLS-ready within 30 seconds" >&2
            exit 1
          fi
          {
            echo "COTURN_CONFORMANCE=1"
            echo "TURN_HOST=127.0.0.1"
            echo "TURN_UDP_PORT=3478"
            echo "TURN_TCP_PORT=3478"
            echo "TURN_TLS_PORT=5349"
            echo "TURN_USER=$TURN_USER"
            echo "TURN_PASS=$TURN_PASS"
            echo "TURN_TLS_SNI=$TURN_TLS_SNI"
          } >> "$GITHUB_ENV"

      # Runs ONLY the ignored coturn conformance test with the real-I/O feature.
      # The default serialized gate leaves it ignored and never compiles the
      # feature, so it stays Docker-free on macOS/Windows.
      - name: Run coturn conformance (ignored-only)
        run: >
          cargo nextest run --locked -p cockpit-core
          --features turn-coturn-conformance
          --run-ignored ignored-only
          -E 'test(remote_turn_socket_provider_coturn_conformance)'

      - name: Print coturn logs on failure
        if: failure()
        run: |
          docker logs coturn || true
          if [ -f "$RUNNER_TEMP/coturn-logs/turnserver.log" ]; then
            sed -n '1,400p' "$RUNNER_TEMP/coturn-logs/turnserver.log" || true
          fi

      - name: Stop coturn
        if: always()
        run: docker rm -f coturn || true
