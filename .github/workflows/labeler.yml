name: PR labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  runners:
    name: Select CI runners
    uses: ./.github/workflows/ci-runners.yml

  label:
    name: Label PR
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    timeout-minutes: 5
    steps:
      - name: Label PR
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
