name: PR checks

on:
  pull_request:
    branches: [main, master]

# Cancel superseded runs when a PR is force-pushed.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege token: PR checks only read the repo.
permissions:
  contents: read

jobs:
  runners:
    name: Select CI runners
    uses: ./.github/workflows/ci-runners.yml

  # Shared setup: install dependencies once and cache for downstream jobs.
  setup:
    name: Install dependencies
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache workspace
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

  # ── Validation jobs (all depend on setup) ──────────────────────────

  lint:
    name: Lint & format
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Lint & format check
        run: pnpm check:ci

  typecheck:
    name: Type check
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Type check
        run: pnpm check-types

  build:
    name: Build
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Build
        run: pnpm build

  test:
    name: Test
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    # The unit-test graph imports the shared server/worker environment through
    # @flycockpit/queue.  These values only satisfy startup validation: unit
    # tests mock persistence, and Redis integration coverage is invoked below
    # with TEST_REDIS_URL explicitly set.
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: https://app.example.test
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Remote signaling Redis integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: pnpm --filter @flycockpit/api exec vitest run --config vitest.redis.config.ts src/lib/remote-signaling-store.redis.test.ts

      - name: Signaling gateway Redis integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
          REDIS_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: pnpm --filter server exec vitest run --config vitest.redis.config.ts src/remote-signaling-gateway/remote-signaling.redis.test.ts

  # ── Policy checks (grep-based, enforce AGENTS.md rules) ───────────

  policy-checks:
    name: Policy checks
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      # Forbid transition-all — must explicitly list animated properties.
      # AGENTS.md: "Never use transition: all"
      - name: Forbid transition-all
        run: |
          if grep -rn --include='*.css' --include='*.tsx' --include='*.ts' \
            -E '(transition:\s*["'\''`]?all|transition-all)' \
            apps/ packages/ \
            | grep -v 'node_modules' \
            | grep -v '/dist/'; then
            echo "::error::Found 'transition-all' — explicitly list properties instead."
            exit 1
          fi

      # Forbid .useQuery() / .useMutation() directly on oRPC — must use queryOptions() / mutationOptions().
      # AGENTS.md: "Queries: useQuery(orpc...queryOptions(...))"
      - name: Forbid orpc.*.useQuery / useMutation
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E 'orpc\.[a-zA-Z]+\.[a-zA-Z]+\.(useQuery|useMutation)\(' \
            apps/ packages/ \
            | grep -v 'node_modules'; then
            echo "::error::Use queryOptions() / mutationOptions() instead of .useQuery() / .useMutation()."
            exit 1
          fi

      # Forbid @ts-ignore — must use @ts-expect-error with a reason.
      - name: Forbid @ts-ignore
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
            '@ts-ignore' \
            apps/ packages/ \
            | grep -v 'node_modules'; then
            echo "::error::Use @ts-expect-error with a reason instead of @ts-ignore."
            exit 1
          fi

      # Forbid raw useEffect in components and routes without effect:audited tag.
      # AGENTS.md: "Direct useEffect calls are banned in component files."
      - name: Forbid unaudited useEffect in components/routes
        run: |
          violations=$(awk '
            FNR == 1 { prev = "" }
            /useEffect\(/ && $0 !~ /import.*useEffect/ && prev !~ /effect:audited/ && $0 !~ /\/\/ eslint-disable/ {
              print FILENAME ":" FNR ":" $0
            }
            { prev = $0 }
          ' $(find apps/web/src/components apps/web/src/routes -type f \( -name '*.ts' -o -name '*.tsx' \)))
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Found unaudited useEffect in components/routes. Move to a custom hook or add '// effect:audited — <reason>' comment."
            exit 1
          fi

      # Forbid mutationFn pattern — must use mutationOptions().
      # AGENTS.md: "useMutation(orpc...mutationOptions(...)) — not useMutation({ mutationFn: ... })"
      - name: Forbid mutationFn with oRPC
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
            -E 'mutationFn:\s*.*\.(call|mutate)\(' \
            apps/ packages/ \
            | grep -v 'node_modules'; then
            echo "::error::Use mutationOptions() instead of mutationFn with .call()."
            exit 1
          fi

      # Forbid isLoading destructured from useQuery/useMutation — use isPending instead.
      # AGENTS.md: "Use isPending (not isLoading) for first-load gating"
      # Only flags the destructure pattern `{ isLoading } = useQuery(` — not local useState.
      - name: Forbid isLoading from useQuery/useMutation
        run: |
          if grep -rn --include='*.tsx' --include='*.ts' \
            -P 'isLoading.+= use(Query|Mutation|InfiniteQuery|Suspense)\b' \
            apps/web/src/ \
            | grep -v 'node_modules'; then
            echo "::error::Use isPending instead of isLoading from TanStack Query hooks."
            exit 1
          fi


      # Forbid route loaders from reading Better Auth directly — use the server-side route session helper.
      # AGENTS.md: routes should use getRouteSession() plus route-session-access decisions.
      - name: Forbid authClient.getSession in web routes
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
            'authClient\.getSession' \
            apps/web/src/routes/ \
            | grep -v 'node_modules'; then
            echo "::error::Use getRouteSession() in route loaders instead of authClient.getSession()."
            exit 1
          fi

      # Forbid direct Better Auth session hooks outside the centralized hook.
      # AGENTS.md: web consumers should use useAuthSessionSnapshot()/route context.
      - name: Forbid direct authClient.useSession in web app
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
            'authClient\.useSession(' \
            apps/web/src/ \
            | grep -v 'apps/web/src/hooks/use-auth-session.ts' \
            | grep -v 'node_modules'; then
            echo "::error::Use the centralized auth session hook instead of authClient.useSession()."
            exit 1
          fi

      # Forbid destructive Prisma commands in Dockerfile and package.json scripts.
      # AGENTS.md: "Dangerous Commands — Never Run These"
      # apps/cli is excluded: the Rust CLI manages its own local SQLite store,
      # and its migrations/queries legitimately contain DELETE FROM statements.
      - name: Forbid destructive Prisma commands
        run: |
          if grep -rnE \
            '(migrate reset|migrate dev|migrate deploy|db push --force-reset|db drop|--accept-data-loss|DROP TABLE|DROP DATABASE|TRUNCATE|DELETE FROM[[:space:]]+[^;]+;)' \
            Dockerfile Dockerfile.dev Dockerfile.worker package.json docker-compose*.yml render.yaml scripts/ apps/ packages/ .github/workflows/ \
            | grep -v 'scripts/docker-entrypoint.sh:' \
            | grep -v 'scripts/db-push-dangerous-local.sh:' \
            | grep -v '.github/workflows/pr-checks.yml:' \
            | grep -v '.github/workflows/main-checks.yml:' \
            | grep -v '^apps/cli/' \
            | grep -v '/dist/' \
            | grep -v 'node_modules'; then
            echo "::error::Found forbidden destructive Prisma or SQL command. Use the documented db:push flow and explicit local-only dangerous script instead."
            exit 1
          fi

  # ── Prisma schema validation ──────────────────────────────────────

  prisma-validate:
    name: Prisma validate
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Validate schema
        run: pnpm -F @flycockpit/db exec prisma validate

      - name: Check schema formatting
        run: pnpm -F @flycockpit/db exec prisma format --check

  # ── React Doctor (React health scan: hooks, a11y, perf, security) ─

  react-doctor:
    name: React Doctor
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Required for --scope changed: react-doctor uses `git merge-base` to find
          # the common ancestor with the base branch.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Run react-doctor (changed files only)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          pnpm exec react-doctor . \
            --scope changed \
            --base "origin/${BASE_REF}" \
            --annotations \
            --offline \
            -y

  # ── Knip (unused exports & dependencies) ───────────────────────────

  knip:
    name: Unused code check
    needs:
      - runners
      - setup
    runs-on: ${{ needs.runners.outputs.ubuntu }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/db/prisma/generated
          key: workspace-${{ github.sha }}

      - name: Knip
        run: pnpm knip

  # ── pnpm audit (known-CVE check against the lockfile) ─────────────

  pnpm-audit:
    name: pnpm audit
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 24

      # pnpm audit reads pnpm-lock.yaml directly — no install needed.
      #
      # Threshold is `high`: lockfile is clean of high+ advisories. The
      # remaining moderates are tracked via Dependabot. Bump to `moderate`
      # once those are cleared.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  # ── Secret scanning (always-on for non-draft PRs) ─────────────────

  secret-scan:
    name: Secret scan
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          extra_args: --results=verified,unknown

      - name: Template secret patterns
        run: |
          set -euo pipefail
          matches="$(
            {
              git grep -nE '(^|[[:space:]])(BETTER_AUTH_SECRET|VAPID_PRIVATE_KEY)[[:space:]]*=[[:space:]]*[^[:space:]#]+' -- \
                ':!*.example' ':!.env.docker.defaults' ':!*.md' || true
              git grep -nE 'DATABASE_URL[[:space:]]*=[[:space:]]*postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@' -- \
                ':!*.example' ':!.env.docker.defaults' ':!docker-compose.agent.yml' ':!*.md' || true
              git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- \
                ':!*.example' ':!.env.docker.defaults' || true
            } | grep -v 'generateValue: true' | grep -v 'allowlist secret' || true
          )"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Potential private secret committed. Rotate the secret and remove it from git history if it was real."
            exit 1
          fi

  # ── Docker image build ────────────────────────────────────────────

  docker:
    name: Docker image build
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_large }}
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: ./Dockerfile
          - image: worker
            dockerfile: ./Dockerfile.worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ github.event.repository.name }}-${{ matrix.image }}-pr:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # v0.36.0
        with:
          image-ref: ${{ github.event.repository.name }}-${{ matrix.image }}-pr:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
