name: Release Preflight

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RUSTFLAGS: "-D warnings"

jobs:
  runners:
    name: Select CI runners
    uses: ./.github/workflows/ci-runners.yml

  checks:
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_large }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
      # Scoped to the whole workspace, not just the `cockpit-cli` package: the
      # released binary links `cockpit-tui` and the `crates/*` layers, so a
      # package-scoped preflight would silently skip most of the shipped code.
      # Matches the workspace-scoped gate in cli-ci.yml. Every Cargo step runs
      # from the monorepo root and reuses flycockpitapp/target via CARGO_TARGET_DIR.
      - run: cargo fmt --all --check
      - run: python3 apps/cli/scripts/generate-runtime-docs.py --check
      - run: cargo clippy --workspace --tests --locked -- -D warnings
      - run: cargo clippy --locked --workspace --examples -- -D warnings
      - uses: taiki-e/install-action@314b6e93a9b2f40a64f401a23fed55603083dc69 # nextest
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
