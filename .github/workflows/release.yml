name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v0.1.0. Must match apps/cli/Cargo.toml.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  runners:
    name: Select CI runners
    uses: ./.github/workflows/ci-runners.yml

  validate:
    name: Validate release request
    needs: runners
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: release
        name: Validate version and branch
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run releases from the main branch. Current ref is $GITHUB_REF."
            exit 1
          fi

          tag="$VERSION"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a SemVer tag like v0.1.0 without build metadata."
            exit 1
          fi

          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -n 1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::apps/cli/Cargo.toml version is $cargo_version, expected $version."
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release-preflight:
    name: CLI release preflight
    needs: validate
    uses: ./.github/workflows/release-preflight.yml
    secrets: inherit

  plan-cli-release:
    name: Plan CLI release
    needs:
      - runners
      - validate
      - release-preflight
    runs-on: ${{ needs.runners.outputs.ubuntu_2204 }}
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.validate.outputs.tag }}
      tag-flag: --tag=${{ needs.validate.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_TARGET_DIR: target
      FLYCOCKPIT_RELEASE_PROFILE: local-v0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        run: git tag --force "${{ needs.validate.outputs.tag }}" "${{ github.sha }}"

      - name: Enforce official Cargo feature policy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-official-release-feature-policy.sh
          default_features="$(sed -n '/^\[features\]/,/^\[/p' apps/cli/Cargo.toml | sed -n 's/^default = \(.*\)$/\1/p')"
          if [ "$default_features" != "[]" ]; then
            echo "::error::official release default features must be empty"
            exit 1
          fi
          grep -q '^remote = \[' apps/cli/Cargo.toml
          ! grep -Eq 'features[[:space:]]*=[[:space:]]*\[[^]]*remote' dist-workspace.toml
          jq -e '.profile == "local-v0.1" and (.targets | length == 5)' apps/cli/release/local-runtime-capabilities-v1.json
          jq -e '.profile == "local-v0.1" and (.localProtocolTagDenylist | length > 0)' apps/cli/release/local-profile-inventory-v1.json
          scripts/check-local-release-profile.sh

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        name: Plan dist release
        env:
          RUNNER_X86_64_UNKNOWN_LINUX_GNU: ${{ needs.runners.outputs.ubuntu_2204_large }}
          RUNNER_AARCH64_UNKNOWN_LINUX_GNU: ${{ needs.runners.outputs.ubuntu_2204_arm }}
          RUNNER_AARCH64_APPLE_DARWIN: ${{ needs.runners.outputs.macos_large }}
          RUNNER_X86_64_APPLE_DARWIN: ${{ needs.runners.outputs.macos_intel }}
          RUNNER_X86_64_PC_WINDOWS_MSVC: ${{ needs.runners.outputs.windows }}
        run: |
          set -euo pipefail
          mkdir -p target/distrib
          dist host --steps=create --tag=${{ needs.validate.outputs.tag }} --allow-dirty --output-format=json > target/distrib/plan-dist-manifest.json
          echo "dist ran successfully"
          if jq -e '.. | strings | select(test("(^|[ =,])(--all-features|--features|-F)|cockpit-cli/(remote|grok-subscription)"))' target/distrib/plan-dist-manifest.json >/dev/null; then
            echo "::error::cargo-dist planned a Cargo feature selection"
            exit 1
          fi

          : "${RUNNER_X86_64_UNKNOWN_LINUX_GNU:?missing ubuntu_2204_large}"
          : "${RUNNER_AARCH64_UNKNOWN_LINUX_GNU:?missing ubuntu_2204_arm}"
          : "${RUNNER_AARCH64_APPLE_DARWIN:?missing macos_large}"
          : "${RUNNER_X86_64_APPLE_DARWIN:?missing macos_intel}"
          : "${RUNNER_X86_64_PC_WINDOWS_MSVC:?missing windows}"

          # Remap artifacts_matrix.runner from ci-runners.yml before the plan is consumed.
          # Map by target: global and linux-x64 both emit ubuntu-22.04 from dist host.
          jq \
            --arg x86_64_unknown_linux_gnu "$RUNNER_X86_64_UNKNOWN_LINUX_GNU" \
            --arg aarch64_unknown_linux_gnu "$RUNNER_AARCH64_UNKNOWN_LINUX_GNU" \
            --arg aarch64_apple_darwin "$RUNNER_AARCH64_APPLE_DARWIN" \
            --arg x86_64_apple_darwin "$RUNNER_X86_64_APPLE_DARWIN" \
            --arg x86_64_pc_windows_msvc "$RUNNER_X86_64_PC_WINDOWS_MSVC" \
            '
            def runner_for($target):
              if $target == "x86_64-unknown-linux-gnu" then $x86_64_unknown_linux_gnu
              elif $target == "aarch64-unknown-linux-gnu" then $aarch64_unknown_linux_gnu
              elif $target == "aarch64-apple-darwin" then $aarch64_apple_darwin
              elif $target == "x86_64-apple-darwin" then $x86_64_apple_darwin
              elif $target == "x86_64-pc-windows-msvc" then $x86_64_pc_windows_msvc
              else error("unknown cargo-dist artifact target: \($target)")
              end;
            if (.ci.github.artifacts_matrix.include | type) == "array" then
              .ci.github.artifacts_matrix.include |= map(
                (.targets // []) as $targets |
                if ($targets | length) == 0 then
                  error("artifacts_matrix include entry has no targets")
                else
                  ([ $targets[] | runner_for(.) ] | unique) as $mapped |
                  if ($mapped | length) != 1 then
                    error("artifacts_matrix include targets map to different runners: \($targets)")
                  else
                    .runner = $mapped[0]
                  end
                end
              )
            elif (.ci.github.artifacts_matrix.include == null) then
              .
            else
              error("ci.github.artifacts_matrix.include must be an array or null")
            end
            ' target/distrib/plan-dist-manifest.json > target/distrib/plan-dist-manifest.remapped.json
          mv target/distrib/plan-dist-manifest.remapped.json target/distrib/plan-dist-manifest.json

          cat target/distrib/plan-dist-manifest.json
          echo "manifest=$(jq -c "." target/distrib/plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/plan-dist-manifest.json

  build-cli-local-artifacts:
    name: build-cli-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: plan-cli-release
    if: ${{ fromJson(needs.plan-cli-release.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-cli-release.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_TARGET_DIR: target
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      # Release toolchain pin (issue #306): every artifact is built with the
      # same MSRV toolchain the cli-ci MSRV leg validates (apps/cli's
      # rust-version), never the runner's floating preinstalled stable.
      - name: Install pinned release Rust toolchain (container)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup > /dev/null 2>&1; then
            rustup toolchain install 1.95.0 --profile minimal
            rustup default 1.95.0
          else
            # rustup itself is installed over TLS-pinned https; the toolchain
            # is pinned to 1.95.0, not whatever rustup defaults to today.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned release Rust toolchain
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.95.0

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}

      - name: Generate completions and man pages
        shell: bash
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_BUILD_RUSTFLAGS: ""
        run: |
          while IFS='=' read -r variable _; do
            case "$variable" in
              CARGO_TARGET_*_RUSTFLAGS) unset "$variable";;
            esac
          done < <(env)
          ./apps/cli/scripts/generate-release-assets.sh

      - name: Build artifacts
        env:
          # Cargo turns these into `#[cfg(feature = ...)]` compiler cfgs. The
          # official artifact must not inherit externally supplied cfgs that
          # could make the gated Grok OAuth code reachable.
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_BUILD_RUSTFLAGS: ""
        run: |
          while IFS='=' read -r variable _; do
            case "$variable" in
              CARGO_TARGET_*_RUSTFLAGS) unset "$variable";;
            esac
          done < <(env)
          dist build ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --print=linkage --output-format=json ${{ matrix.dist_args }} > target/distrib/dist-manifest.json
          echo "dist ran successfully"

      - name: Verify built local executables
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' executable; do
            found=$((found + 1))
            COCKPIT_RELEASE_BIN="$executable" scripts/check-local-release-profile.sh --artifact-only
          done < <(find target -type f \( -name cockpit -o -name cockpit.exe \) -path '*/release/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::cargo-dist produced no Cockpit executable to verify"
            exit 1
          fi

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest target/distrib/dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp target/distrib/dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-cli-global-artifacts:
    name: build-cli-global-artifacts
    needs:
      - runners
      - plan-cli-release
      - build-cli-local-artifacts
    runs-on: ${{ needs.runners.outputs.ubuntu_2204_large }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_TARGET_DIR: target
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      # Same pinned toolchain as the per-target artifact builds (issue #306):
      # this job compiles cockpit-cli examples for completions/man pages.
      - name: Install pinned release Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.95.0

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Generate completions and man pages
        shell: bash
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_BUILD_RUSTFLAGS: ""
        run: |
          while IFS='=' read -r variable _; do
            case "$variable" in
              CARGO_TARGET_*_RUSTFLAGS) unset "$variable";;
            esac
          done < <(env)
          ./apps/cli/scripts/generate-release-assets.sh

      - id: cargo-dist
        shell: bash
        env:
          # Keep the global artifacts subject to the same clean cfg boundary
          # as target-specific cargo-dist builds above.
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_BUILD_RUSTFLAGS: ""
        run: |
          while IFS='=' read -r variable _; do
            case "$variable" in
              CARGO_TARGET_*_RUSTFLAGS) unset "$variable";;
            esac
          done < <(env)
          dist build ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --output-format=json "--artifacts=global" > target/distrib/dist-manifest.json
          echo "dist ran successfully"

          ./apps/cli/scripts/patch-dist-assets.py
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" target/distrib/dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp target/distrib/dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  publish-cli-release:
    name: Publish CLI GitHub Release
    needs:
      - runners
      - plan-cli-release
      - build-cli-local-artifacts
      - build-cli-global-artifacts
    if: ${{ always() && needs.plan-cli-release.result == 'success' && (needs.build-cli-global-artifacts.result == 'skipped' || needs.build-cli-global-artifacts.result == 'success') && (needs.build-cli-local-artifacts.result == 'skipped' || needs.build-cli-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_TARGET_DIR: target
    # Keyless Sigstore signing + provenance attestation via the job's OIDC
    # token (owner decision 2026-09-01, issue #306): no long-lived key custody.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ${{ needs.runners.outputs.ubuntu_2204 }}
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      # cargo-dist 0.32.0 metadata finalization, NOT a publication step:
      # for GitHub hosting `dist host --steps=upload --steps=release`
      # performs no GitHub API operations (src/host.rs `do_host` leaves
      # upload/release to the CI job's `gh` commands). The one and only
      # publication point in this workflow is the draft-first step after
      # signing and attestation below.
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --steps=upload --steps=release --output-format=json > target/distrib/dist-manifest.json
          echo "dist finalized the release manifest; publication happens after signing below"
          cat target/distrib/dist-manifest.json
          echo "manifest=$(jq -c "." target/distrib/dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: artifacts-dist-manifest
          path: target/distrib/dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Cleanup
        run: find artifacts -type f -name '*-dist-manifest.json' -delete

      # Single source of truth for "what is a release file" (issue #306):
      # this step derives the exact file list ONCE — recursive, files only,
      # no dist manifests, no signature bundles — and the attest, sign,
      # assert, and publish steps below all consume this list instead of
      # re-globbing the tree. Sign therefore signs exactly the files assert
      # checks and publish uploads; a bundle can never be mistaken for a
      # subject needing its own bundle, and a nested artifacts layout cannot
      # slip a file past one glob but not another.
      - id: release-files
        name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            ! -name '*-dist-manifest.json' ! -name '*.sig.bundle' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release files found in artifacts."
            find artifacts -maxdepth 3 -print | sort
            exit 1
          fi
          {
            echo "files<<__RELEASE_FILES_EOF__"
            printf '%s\n' "${files[@]}"
            echo "__RELEASE_FILES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Signed + attested release artifacts (owner decision 2026-09-01, issue
      # #306): keyless Sigstore via GitHub OIDC, no long-lived keys.
      # Provenance attestations are pushed to this repo; every release file
      # also gets a detached .sig.bundle uploaded alongside it.
      - name: Attest release artifacts (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Exact newline-delimited subject list from the collect step — the
          # same files sign signs and publish uploads (subject-path accepts a
          # list of paths, not just a glob).
          subject-path: ${{ steps.release-files.outputs.files }}

      - name: Sign release artifacts (keyless, GitHub OIDC)
        shell: bash
        env:
          RELEASE_FILES: ${{ steps.release-files.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r artifact; do
            echo "signing $artifact"
            cosign sign-blob --yes --bundle "${artifact}.sig.bundle" "$artifact"
          done <<< "$RELEASE_FILES"

      # Invariant (issue #306, review cycle 1): a public GitHub Release never
      # exposes an asset without its detached Sigstore bundle. Assert bundle
      # completeness BEFORE any publication command runs; a partial or failed
      # sign step fails here instead of publishing un-bundled assets. The
      # check runs over the same collected release-file list, so every signed
      # subject is asserted and no bundle is checked for a bundle.
      - name: Assert every release artifact has a signature bundle
        shell: bash
        env:
          RELEASE_FILES: ${{ steps.release-files.outputs.files }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r artifact; do
            if [ ! -f "${artifact}.sig.bundle" ]; then
              echo "::error::No signature bundle for $artifact; refusing to publish."
              status=1
            fi
          done <<< "$RELEASE_FILES"
          exit "$status"

      # Publication is draft-first and therefore atomic (issue #306, review
      # cycle 1): the release is created as a DRAFT (invisible to
      # releases/latest, unlisted), every artifact and .sig.bundle is uploaded
      # while it is still a draft, and only the final `--draft=false` makes it
      # public. A cancel, timeout, or failure anywhere before that final
      # command leaves a draft release — never a public release with missing or
      # unsigned bytes. Re-entry is safe: an existing release — a partial
      # draft from an earlier failed run, OR one that a previous run already
      # made public — is re-drafted BEFORE any upload, so `--clobber` never
      # replaces assets in public view; the upload and un-draft below are then
      # identical to the create path.
      - name: Publish GitHub Release (draft-first)
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_FILES: ${{ steps.release-files.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail

          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          tag="${{ needs.plan-cli-release.outputs.tag }}"

          # Same collected list the sign and assert steps operated on; each
          # artifact is uploaded together with its detached bundle.
          mapfile -t release_files < <(printf '%s\n' "$RELEASE_FILES")
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No release files found in artifacts."
            find artifacts -maxdepth 3 -print | sort
            exit 1
          fi
          upload_files=()
          for artifact in "${release_files[@]}"; do
            upload_files+=("$artifact" "${artifact}.sig.bundle")
          done

          if gh release view "$tag" > /dev/null 2>&1; then
            # Re-entry: the release may already be public (a previous run
            # un-drafted it, or failed after --draft=false). Re-draft it
            # first — publication is ALWAYS draft-first — so the upload
            # below cannot clobber assets in public view.
            gh release edit "$tag" --draft --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
          else
            gh release create "$tag" --draft --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
          fi
          gh release upload "$tag" --clobber "${upload_files[@]}"
          gh release edit "$tag" --draft=false

  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs:
      - runners
      - validate
      - publish-cli-release
    runs-on: ${{ needs.runners.outputs.ubuntu_2204_small }}
    environment: release
    steps:
      - name: Validate tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN to a token with contents:write access to FlyCockpit/homebrew-tap."
            exit 1
          fi

      - name: Download generated formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - id: formula
        name: Find generated formula
        shell: bash
        run: |
          set -euo pipefail

          formula_path="$(find artifacts -type f -name cockpit.rb -print -quit)"
          if [ -z "$formula_path" ]; then
            echo "::error::Generated cockpit.rb formula was not found in downloaded artifacts."
            find artifacts -maxdepth 3 -print | sort
            exit 1
          fi

          echo "path=$formula_path" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyCockpit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Commit formula to tap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p homebrew-tap/Formula
          cp "${{ steps.formula.outputs.path }}" homebrew-tap/Formula/cockpit.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/cockpit.rb
          if git diff --cached --quiet -- Formula/cockpit.rb; then
            echo "Formula/cockpit.rb already matches ${{ needs.validate.outputs.tag }}."
            exit 0
          fi

          git commit -m "cockpit ${{ needs.validate.outputs.tag }}"
          git push origin HEAD:main

  release-summary:
    name: Release summary
    needs:
      - runners
      - validate
      - publish-cli-release
      - publish-homebrew-formula
    if: ${{ always() && needs.publish-cli-release.result == 'success' && needs.publish-homebrew-formula.result == 'success' }}
    runs-on: ${{ needs.runners.outputs.ubuntu_small }}
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo '## Release ${{ needs.validate.outputs.tag }}'
            echo
            echo '- CLI artifacts: GitHub Release ${{ needs.validate.outputs.tag }}'
            echo '- Shell installer: `curl --proto "=https" --tlsv1.2 -LsSf https://github.com/FlyCockpit/flycockpitapp/releases/latest/download/cockpit-cli-installer.sh | sh`'
            echo '- Homebrew: `brew install flycockpit/tap/cockpit`'
            echo '- Every artifact is signed (keyless Sigstore, GitHub OIDC) with a detached `.sig.bundle` uploaded alongside it and carries a build-provenance attestation on the release commit. Verify a download with:'
            echo '  `cosign verify-blob --bundle <artifact>.sig.bundle --certificate-identity-regexp=https://github.com/FlyCockpit/flycockpitapp/.github/ --certificate-oidc-issuer=https://token.actions.githubusercontent.com <artifact>`'
            echo '- The installers cannot drift from the signed bytes: the shell installer verifies the SHA-256 digest embedded by cargo-dist before extracting, and the Homebrew formula pins the same digest, so both consume exactly the artifacts that were signed and attested. Sigstore bundle verification above is the provenance check for anyone who needs it.'
          } >> "$GITHUB_STEP_SUMMARY"
