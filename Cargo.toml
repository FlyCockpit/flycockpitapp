[workspace]
members = [
    "apps/cli",
    "apps/tenant-authority",
    "crates/cockpit-config",
    "crates/cockpit-core",
    "crates/cockpit-db",
    "crates/cockpit-host",
    "crates/cockpit-noise",
    "crates/cockpit-proto",
    "crates/cockpit-test-support",
    "crates/cockpit-tokenizer",
    "crates/cockpit-tui",
    "crates/relay-protocol",
]
resolver = "3"

# Shared dependency specs: every dependency used by two or more workspace
# members lives here exactly once; members opt in with `{ workspace = true }`
# and add member-specific `features = [...]` additively where they differ
# (e.g. tokio, reqwest). Entries whose feature sets are identical across all
# consumers carry the full spec here. Single-member dependencies stay local
# to their crate's manifest.
[workspace.dependencies]
aho-corasick = "1"
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
base64 = "0.22"
brush-parser = "0.4"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
csv = "1"
# Scheduler cron parser evaluation (2026-07-20): croner 3.0.1 is MIT
# licensed, edition 2021 with no rust-version pin, and uses chrono-only
# calendar math with no platform-specific APIs, so it is compatible with the
# workspace MSRV 1.95.0 and Windows CI targets.
croner = "3.0.1"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = "=0.2.35"
jsonc-parser = { version = "0.33.0", default-features = false }
jsonschema = { version = "0.46", default-features = false }
jaq-core = "3.1.0"
jaq-json = "2.0.1"
jaq-std = "3.0.1"
keepawake = "0.6"
# Direct pins for daemon-owned native secure keys (`native-secure-key-store`).
# Application model: keyring-core + one target native store (never the
# all-in-one `keyring` facade). Platform crates are target-gated on members.
keyring-core = { version = "=1.0.0", default-features = false }
libc = "0.2"
lsp-types = "0.97"
monty = { git = "https://github.com/pydantic/monty.git", rev = "4cae0789864668b6b642a02c1b06d352f5a67313" }
notify = "8"
# ES256 (ECDSA/P-256) verification for signed public service policy / attempt
# grants. Exact-pinned, pure Rust, MSRV 1.95-compatible, no C toolchain; already
# vendored in Cargo.lock transitively (dimpl, str0m-rust-crypto) and as a
# cockpit-proto dev-dependency. The single workspace pin for direct consumers —
# no other crate may introduce a second p256 version pin.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "arithmetic", "digest"] }
predicates = "3"
rand = "0.10"
rayon = "1"
regex = "1"
# Members add their own features (json/rustls/stream) additively; keeping the
# workspace entry featureless-with-no-defaults prevents one member's feature
# needs from silently growing another member's build.
reqwest = { version = "0.13", default-features = false }
# Portable Rig contracts + provider transport only (completion/message/providers).
# Depend on `rig-core` directly — not the `rig` facade umbrella, which locks
# unused companion crates (agent, lancedb, fastembed, …) into Cargo.lock even
# when their features are off. Dependency key stays `rig` so `use rig::…`
# keeps working against lib target `rig_core` (renamed in 0.37). Features:
# `image` (message/provider image paths), `rustls` (TLS stance), `reqwest`
# (http2/system-proxy/charset; not enabled by default-features = false alone).
# Never enable facade `agent` / companion features — Cockpit owns the tool loop.
rig = { version = "0.42", package = "rig-core", default-features = false, features = ["image", "rustls", "reqwest"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shellexpand = "3"
similar = "3"
sqlite-vec = "0.1.9"
tempfile = "3"
thiserror = "2"
# Feature sets differ per member (rt-only in cockpit-config, full runtime in
# the binaries); members declare their own features additively.
tokio = "1.52"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-normalization = "0.1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.26.10"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
walkdir = "2"
which = "8"
zbus = "5"
zerobox = "0.3"
# Direct pin: zeroize 1.9.0, no derive; alloc for Zeroizing/Vec paths.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Shared lint posture for every workspace member (each opts in with
# `[lints] workspace = true`). Warnings-as-errors stays enforced by the
# CI/gate flag `cargo clippy --locked --workspace -- -D warnings`
# (.github/workflows/cli-ci.yml); this table is the shared home for named
# lint-level overrides. No named overrides exist today — module-level
# `#![allow(dead_code)]` attributes in a few files are intentionally
# file-scoped and stay in source.
[workspace.lints]

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Local release-like builds: faster code generation and linking than the
# shipping profile. `dist` continues to inherit the fully optimized release profile.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

[profile.dist]
inherits = "release"
