[package]
name = "tenant-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Reference-only tenant-authority contract: codecs, schemas, and closed-handler surface; mTLS listener, PKCS#11 signing, and evidence verification are not wired"

[lints]
workspace = true

[features]
default = []
remote = ["dep:cockpit-proto", "cockpit-proto/remote"]

[lib]
path = "src/lib.rs"

# Reference binary: `serve` fails closed (not implemented on Unix; unsupported
# platform elsewhere). Offline subcommands compile the surface only.
[[bin]]
name = "tenant-authority"
path = "src/bin/tenant-authority.rs"
required-features = ["remote"]

# Single acceptance integration binary: the nine exact top-level tests.
[[test]]
name = "tenant_authority_service_acceptance"
path = "tests/tenant_authority_service_acceptance.rs"
required-features = ["remote"]

[dependencies]
cockpit-proto = { path = "../../crates/cockpit-proto", optional = true }
anyhow = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Unix-only peer-credential / admin-socket adapter for the production service.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
base64 = { workspace = true }
