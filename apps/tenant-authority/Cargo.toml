[package]
name = "tenant-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Customer-operated tenant-authority reference service implementing the eleven closed canonical operations over submit-only mTLS with non-exportable PKCS#11-backed keys"

[lints]
workspace = true

[features]
default = []
remote = ["dep:cockpit-proto", "cockpit-proto/remote"]

[lib]
path = "src/lib.rs"

# Production binary: opens the submit-only mTLS listener on Unix; exits before
# opening a listener with typed `unsupported_platform` on non-Unix targets so
# the codec/validator/state-machine surface stays compilable on the workspace
# MSRV and Windows CI target.
[[bin]]
name = "tenant-authority"
path = "src/bin/tenant-authority.rs"
required-features = ["remote"]

# Single acceptance integration binary: the nine exact top-level tests.
[[test]]
name = "tenant_authority_service_acceptance"
path = "tests/tenant_authority_service_acceptance.rs"
required-features = ["remote"]

[dependencies]
cockpit-proto = { path = "../../crates/cockpit-proto", optional = true }
anyhow = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Unix-only peer-credential / admin-socket adapter for the production service.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
base64 = { workspace = true }
