[package]
name = "cockpit-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Dependency-minimal local daemon client transport for Cockpit"
license = "Apache-2.0"
repository = "https://github.com/FlyCockpit/flycockpitapp"
homepage = "https://github.com/FlyCockpit/flycockpitapp"
publish = false

[lints]
workspace = true

[features]
default = []
extended = ["cockpit-proto/extended"]
remote = ["cockpit-proto/remote"]
test-support = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
cockpit-proto = { path = "../cockpit-proto" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
