[package]
name = "cockpit-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
cockpit-db = { path = "../cockpit-db" }
cockpit-host = { path = "../cockpit-host" }
cockpit-tokenizer = { path = "../cockpit-tokenizer" }
cockpit-test-support = { path = "../cockpit-test-support", optional = true }
dirs = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Exposes the effective-default journal's phase-boundary crash seam so
# daemon-level tests can replay the same failures. Only enabled by
# `cockpit-core`'s dev-dependencies; never by a normal build.
test-support = ["dep:cockpit-test-support"]
# Image-spend ledger tables live in the extended schema profile. Do not
# enable this on the default local-v0.1 graph.
extended = ["cockpit-db/extended"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
cockpit-test-support = { path = "../cockpit-test-support" }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
