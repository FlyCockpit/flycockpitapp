[package]
name = "cockpit-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Application layer for the Cockpit CLI"
license = "Apache-2.0"
repository = "https://github.com/FlyCockpit/flycockpitapp"
homepage = "https://github.com/FlyCockpit/flycockpitapp"
publish = false

# Sole authoritative classification for the platform packages whose complete
# resolved closure and directly selected features are audited by
# `computer_target_dependency_inventory`. Additions belong here in the same
# change that introduces the target dependency; the Rust test has no duplicate
# package allow-list.
[package.metadata.computer-target-dependencies."aarch64-apple-darwin"]
target-selectors = ['cfg(target_os = "macos")', "cfg(unix)"]
audited-direct = [
    "mach2",
    "block2",
    "objc2-app-kit",
    "objc2-application-services",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-color-sync",
    "objc2-foundation",
    "libc",
]
audited-transitive = ["objc2-io-surface"]
excluded-direct = ["apple-native-keyring-store", "security-framework", "security-framework-sys"]

[package.metadata.computer-target-dependencies."x86_64-pc-windows-msvc"]
target-selectors = ['cfg(target_os = "windows")']
audited-direct = ["windows"]
audited-transitive = []
excluded-direct = ["windows-native-keyring-store", "windows-sys"]

[package.metadata.computer-target-dependencies."x86_64-unknown-linux-gnu"]
target-selectors = ['cfg(target_os = "linux")', "cfg(unix)"]
audited-direct = ["x11rb", "atspi"]
audited-transitive = [
    "x11rb-protocol",
    "atspi-common",
    "atspi-connection",
    "atspi-proxies",
    "gethostname",
    "zbus-lockstep",
    "zbus-lockstep-macros",
    "zbus_xml",
]
excluded-direct = ["zbus", "zbus-secret-service-keyring-store", "cryptoki", "libc"]

[features]
default = []
test-support = ["dep:cockpit-test-support"]
# Enables the xAI-authorized SuperGrok browser OAuth implementation. This is
# intentionally off in the official release; user-authored `auth_command`
# providers remain available without it.
grok-subscription = []
extended = ["cockpit-client/extended", "cockpit-config/extended", "cockpit-db/extended", "cockpit-proto/extended"]
# Starts FlyCockpit-owned account/sync/relay background work. The public v0.1
# CLI leaves this off; provider network access remains available independently.
remote = [
    "cockpit-client/remote",
    "cockpit-db/remote",
    "cockpit-proto/remote",
    "dep:flycockpit-relay-protocol",
    "dep:tokio-tungstenite",
    "dep:p256",
    "dep:str0m",
    "dep:str0m-rust-crypto",
    "dep:turn-client-proto",
    "dep:turn-client-rustls",
    "dep:rustls-native-certs",
]
# Compiles the real Linux/WSL PKCS#11 daemon custody adapter (cryptoki). OFF by
# default so the serialized local gate stays green and lock-stable without a
# PKCS#11 module present; the SoftHSM CI job enables it. macOS/Windows adapters
# are target-gated instead (they compile only on their CI matrix legs).
daemon-custody-pkcs11 = ["remote", "dep:cryptoki"]
# Compiles the real Tokio + turn-client-proto/turn-client-rustls TURN allocation
# driver (`daemon::turn_socket_provider::io`) and the ignored coturn conformance
# test. OFF by default so the serialized gate never depends on live TURN
# infrastructure and stays lock-stable; the Linux coturn CI leg enables it. No
# new crates — it cfg-gates code over deps already present.
turn-coturn-conformance = ["remote"]

[lints]
workspace = true

[[test]]
name = "remote_transport_selection_fixtures"
required-features = ["remote"]

[[test]]
name = "remote_turn_socket_provider_coturn_conformance"
required-features = ["turn-coturn-conformance"]

[[test]]
name = "remote_turn_socket_provider_dependency_audit"
required-features = ["remote"]

[dependencies]
tokio = { workspace = true, features = [
    "rt-multi-thread", "macros", "process", "io-util", "fs",
    "net", "signal", "time", "sync",
] }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "rustls", "stream"] }
url.workspace = true
# Workspace: `rig-core` aliased as `rig` — portable contracts + transport only.
rig = { workspace = true }
httpdate = "1"
tokio-tungstenite = { workspace = true, optional = true }
cockpit-client = { path = "../cockpit-client" }
cockpit-config = { path = "../cockpit-config" }
cockpit-db = { path = "../cockpit-db", features = ["host-approval-composition", "host-capability-refresh-composition"] }
cockpit-host = { path = "../cockpit-host" }
cockpit-proto = { path = "../cockpit-proto" }
cockpit-tokenizer = { path = "../cockpit-tokenizer" }
cockpit-test-support = { path = "../cockpit-test-support", optional = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
zip = { workspace = true }
tokio-util = { workspace = true }
lsp-types = { workspace = true }
flycockpit-relay-protocol = { path = "../relay-protocol", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
jsonschema = { workspace = true }
dirs = { workspace = true }
shellexpand = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
notify = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
grep-matcher = { workspace = true }
brush-parser = { workspace = true }
zerobox = { workspace = true }
aho-corasick = { workspace = true }
dotenvy = { workspace = true }
keepawake = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
# Daemon remote identity custody: P-256 ECDSA for the real-key test fake and for
# DER->P1363 low-S normalization in every platform adapter. Exact pin per
# `identity-custody-dedup-and-hardening`; provenance recorded in
# PROVENANCE-remote-identity-custody.json. Already present in Cargo.lock 0.13.2.
# Features: ecdsa (sign+verify) + arithmetic + pem (enables ecdsa DER parsing for
# der_signature_to_low_s_p1363) + digest (hazmat PrehashSigner). All transitive
# crates (rfc6979/primeorder/pem-rfc7468/digest) are already in Cargo.lock.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "arithmetic", "pem", "digest"], optional = true }
urlencoding = { workspace = true }
which = { workspace = true }
monty = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
unicode-normalization = { workspace = true }
csv = { workspace = true }
similar = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
rayon = { workspace = true }
# Pinned, audited exception (owner decision 2026-09-01, issue #306): KEEP
# firecrawl exact-pinned here. It drags a second reqwest 0.12 + OpenSSL/native-TLS
# stack into the otherwise rustls-only binary; the exception is documented and
# contained in deny.toml ([advisories]/[bans]). Do not widen this pin without
# re-auditing that stack and updating deny.toml in the same change.
firecrawl = "=2.12.1"
jsonc-parser = { workspace = true }
# Generated SVG trust boundary. Exact direct pins; both run without optional
# default features so parser/sanitizer behavior cannot drift through features.
# quick-xml 0.41.0 is the first release fixing RUSTSEC-2026-0194 (quadratic
# duplicate-attribute check) and RUSTSEC-2026-0195 (unbounded namespace
# allocation); both advisories affect 0.39.x, which parsed model-generated SVG.
quick-xml = { version = "=0.41.0", default-features = false }
svg-hush = { version = "=0.9.6", default-features = false }

# Native secure key store: keyring-core on every target; exactly one native
# store per supported OS; Unsupported adapter elsewhere. Never the all-in-one
# `keyring` crate. Features pinned exactly per `native-secure-key-store`.
keyring-core = { workspace = true }
zeroize = { workspace = true }
# Sealed-state HMAC: direct pin on this member only (not workspace.dependencies).
# native-secure-sealed-state-store requires exactly 0.13.0 + zeroize feature.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
# HKDF-SHA-256 key derivation for tool-media-subject-binding sealed locators
# (`tool-media-subject-authority-foundation`). Workspace pin is the digest-0.11
# line (`hkdf` 0.13) shared with `hmac` 0.13 and `sha2` 0.11.
hkdf = { workspace = true }
# Protected redaction-history AEAD (`harden-and-wire-protected-redaction-history`).
# ChaCha20-Poly1305, constant-time pure Rust, no CPU-feature variance. Exact
# version already present transitively in Cargo.lock (via `snow`/`dimpl`), so no
# new lockfile entries appear. `alloc` only: enables the one-shot Aead trait for
# encrypt while AeadInPlace covers zeroizing in-place decrypt.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
# Advanced file-vault passphrase KDF. We use caller-owned, zeroized working
# memory rather than the crate's convenience allocator.
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
# WebRTC sans-I/O endpoint: exact str0m 0.21.0 with defaults off and
# rust-crypto only (remote-webrtc-daemon-endpoint). No AWS-LC, OpenSSL,
# platform TLS, or alternate WebRTC stack. The RustCrypto provider is
# configured explicitly per Rtc instance; no process-wide default.
str0m = { version = "=0.21.0", default-features = false, features = ["rust-crypto"], optional = true }
# Direct dependency for the RustCrypto provider: str0m-rust-crypto is the
# backend crate for the "rust-crypto" feature. We depend on it directly so
# we can call default_provider() and install it per-Rtc. Exact 0.5.0 pin
# matches str0m 0.21.0's transitive dependency.
str0m-rust-crypto = { version = "=0.5.0", default-features = false, optional = true }

# TURN relay socket provider (`remote-rust-turn-socket-provider` /
# `turn-socket-provider-real-io`).
# Exact pins per prompt gates. `turn-client-proto` is the sans-I/O TURN
# protocol state machine (RFC 5766/8656); `turn-client-rustls` adds TLS
# transport. Both are MIT OR Apache-2.0, MSRV 1.80.0, edition 2021.
# `default-features = false` + `std` only: disables the optional `openssl`
# feature on turn-client-proto (OpenSSL/native-TLS is forbidden) and avoids
# pulling any server/default features not required by the audited client path.
# The real Tokio driver over these crates is compiled only under the
# `turn-coturn-conformance` feature (verified against pinned coturn on Linux CI).
# `turn-client-rustls` selects no crypto provider; the process installs
# `aws_lc_rs` (only — never `ring`) once via `crate::tls_crypto_provider`
# before any TLS client config is built.
turn-client-proto = { version = "=0.7.1", default-features = false, features = ["std"], optional = true }
turn-client-rustls = { version = "=0.1.0", default-features = false, features = ["std"], optional = true }
# System roots for TLS-to-TURN-server verification (rustls-native-certs). Exact
# pin (no caret) matching the audited lock version.
rustls-native-certs = { version = "=0.8.4", default-features = false, optional = true }
# Process-global rustls provider install (`aws_lc_rs`) shared by TURN TLS and
# media HTTPS. Default features keep the `aws_lc_rs` provider available; `ring`
# is never installed as the process default. Already resolved in Cargo.lock at
# 0.23.43 (previously a dev-dependency), so promoting it to a normal dependency
# adds no new lock entry.
rustls = "=0.23.43"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
zbus-secret-service-keyring-store = { version = "=1.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Linux/WSL daemon custody: PKCS#11 loading only an explicitly configured
# absolute module path (no dlopen search path). Exact pin + crates.io checksum
# per `identity-custody-dedup-and-hardening`; provenance recorded. Optional +
# gated by the `daemon-custody-pkcs11` feature (SoftHSM CI enables it). NOTE:
# cryptoki is NOT yet in Cargo.lock — the gate must refresh the lock (cargo
# fetch / cargo build) before running with `--locked`.
cryptoki = { version = "=0.12.0", default-features = false, optional = true }
# Computer target identity (X11 RandR + optional AT-SPI). Exact audited pins.
x11rb = { version = "=0.13.2", default-features = false, features = ["randr"] }
atspi = { version = "=0.30.0", default-features = false, features = ["connection", "proxies", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }
# macOS daemon custody: Secure Enclave / Keychain nonexportable P-256 via the
# pinned security-framework wrapper. Exact pins per prompt; provenance recorded.
# Both already present in Cargo.lock (3.7.0 / 2.17.0).
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
# Computer target identity — exact audited pins from computer-use-target-identity-and-denylist.
mach2 = { version = "=0.6.0", default-features = false }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# `libc` gates `NSRunningApplication::processIdentifier` (pid_t return).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "AXError", "AXUIElement", "AXValue", "HIServices", "libc"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFFileDescriptor", "CFNumber", "CFRunLoop", "CFString", "CFUUID"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGRemoteOperation", "CGSession", "CGWindow", "libc"] }
objc2-color-sync = { version = "=0.3.2", default-features = false, features = ["std", "ColorSyncDevice"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# Direct ownership for Job Object containment (`cross-platform-descendant-process-containment`).
# Exactly these five leaves; do not rely on cockpit-config or third-party feature activation.
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    # Win32_Security_Cryptography: NCrypt (CNG) key-storage APIs for the Windows
    # daemon custody adapter (TPM Platform Crypto Provider / Software KSP),
    # added by `identity-custody-dedup-and-hardening`. No new crate; feature only.
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Computer target identity + host-installation ACL/handle walk (audited windows 0.62.2).
# Isolated from windows-sys 0.61.2 used by process containment / cockpit-config.
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
cockpit-db = { path = "../cockpit-db", features = ["host-approval-test-support", "test-support"] }
flycockpit-relay-protocol = { path = "../relay-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
assert_cmd = { workspace = true }
# `test-support` exposes the effective-default journal's phase-boundary crash
# seam so daemon-level tests can replay the same failures against real SQLite.
# Dev-only: a normal build never enables it.
cockpit-config = { path = "../cockpit-config", features = ["test-support"] }
# `test-support` exposes cockpit-host's audited Windows DACL-apply test seam so
# this crate's Windows tests can inject broad ACLs and prove the private-verify
# paths reject them (feature unification applies it only to test builds).
# Dev-only: a normal build never enables it.
cockpit-host = { path = "../cockpit-host", features = ["test-support"] }
cockpit-test-support = { path = "../cockpit-test-support" }
predicates = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Source-scan guard for the daemon custody module (syn AST visitor). Already in
# Cargo.lock at 2.x via the workspace; matches cockpit-proto's dev use.
syn = { version = "2", features = ["full", "visit"] }
# Source-range support for the forwarded-MCP production-only source ratchet.
# The lockfile-compatible line is already used by sibling source-scan tests.
proc-macro2 = { version = "1", features = ["span-locations"] }
rcgen = "=0.14.8"
# `rustls` is now a normal dependency (process-global aws_lc_rs provider install);
# see `[dependencies]`. `tokio-rustls` stays dev-only for media_https test servers.
tokio-rustls = "=0.26.4"
