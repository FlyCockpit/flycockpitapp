[package]
name = "cockpit-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Application layer for the Cockpit CLI"
license = "Apache-2.0"
repository = "https://github.com/FlyCockpit/flycockpitapp"
homepage = "https://github.com/FlyCockpit/flycockpitapp"
publish = false

[features]
test-support = []

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = [
    "rt-multi-thread", "macros", "process", "io-util", "fs",
    "net", "signal", "time", "sync",
] }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
# Workspace: `rig-core` aliased as `rig` — portable contracts + transport only.
rig = { workspace = true }
tokio-tungstenite = { workspace = true }
cockpit-config = { path = "../cockpit-config" }
cockpit-db = { path = "../cockpit-db" }
cockpit-proto = { path = "../cockpit-proto" }
cockpit-tokenizer = { path = "../cockpit-tokenizer" }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
zip = { workspace = true }
tokio-util = { workspace = true }
lsp-types = { workspace = true }
flycockpit-relay-protocol = { path = "../relay-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
jsonschema = { workspace = true }
dirs = { workspace = true }
shellexpand = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
notify = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
grep-matcher = { workspace = true }
brush-parser = { workspace = true }
zerobox = { workspace = true }
aho-corasick = { workspace = true }
dotenvy = { workspace = true }
keepawake = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
urlencoding = { workspace = true }
which = { workspace = true }
monty = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
csv = { workspace = true }
similar = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
rayon = { workspace = true }
firecrawl = "2"
jsonc-parser = { workspace = true }

# Native secure key store: keyring-core on every target; exactly one native
# store per supported OS; Unsupported adapter elsewhere. Never the all-in-one
# `keyring` crate. Features pinned exactly per `native-secure-key-store`.
keyring-core = { workspace = true }
zeroize = { workspace = true }
# Sealed-state HMAC: direct pin on this member only (not workspace.dependencies).
# native-secure-sealed-state-store requires exactly 0.13.0 + zeroize feature.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
zbus-secret-service-keyring-store = { version = "=1.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Computer target identity (X11 RandR + optional AT-SPI). Exact audited pins.
x11rb = { version = "=0.13.2", default-features = false, features = ["randr"] }
atspi = { version = "=0.30.0", default-features = false, features = ["connection", "proxies", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }
# Computer target identity — exact audited pins from computer-use-target-identity-and-denylist.
mach2 = { version = "=0.6.0", default-features = false }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "AXError", "AXUIElement", "AXValue", "HIServices", "libc"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFFileDescriptor", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGGeometry", "CGSession", "CGWindow", "libc"] }
objc2-color-sync = { version = "=0.3.2", default-features = false, features = ["std", "ColorSyncDevice"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# Direct ownership for Job Object containment (`cross-platform-descendant-process-containment`).
# Exactly these five leaves; do not rely on cockpit-config or third-party feature activation.
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Computer target identity + host-installation ACL/handle walk (audited windows 0.62.2).
# Isolated from windows-sys 0.61.2 used by process containment / cockpit-config.
windows = { version = "=0.62.2", default-features = false, features = [
    "std",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
assert_cmd = { workspace = true }
# `test-support` exposes the effective-default journal's phase-boundary crash
# seam so daemon-level tests can replay the same failures against real SQLite.
# Dev-only: a normal build never enables it.
cockpit-config = { path = "../cockpit-config", features = ["test-support"] }
cockpit-test-support = { path = "../cockpit-test-support" }
predicates = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rcgen = "=0.14.8"
rustls = "=0.23.43"
tokio-rustls = "=0.26.4"
