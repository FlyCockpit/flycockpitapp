[package]
name = "cockpit-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
# FlyCockpit service synchronization, remote principals, and remote attachment
# ledgers are excluded from the public local v0.1 dependency surface.
default = []
remote = []
# Host-approval settlement is an internal daemon composition capability, not a
# general storage API. `cockpit-core` is the only production consumer that
# enables it; consumers which depend on cockpit-db directly do not expose
# approval-terminalization methods in their default API surface.
host-approval-composition = []
# Enables the DB-owned test authority marker used only by cockpit-core's
# dev-dependency graph. Normal and release consumers cannot construct the
# nil-interrupt fixture authority.
host-approval-test-support = []
# Host-capability refresh decision creation is likewise an internal daemon
# composition capability.  A generic Db caller must not be able to persist an
# automatically resolvable `low_risk` request merely by choosing that string.
host-capability-refresh-composition = []
# Future local-only product domains that are deliberately outside the public
# v0.1 schema: durable cron and image generation/spend ledgers.
extended = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
cockpit-test-support = { path = "../cockpit-test-support" }
toml = { workspace = true }
# Authorized by db-blocking-api-removal: AST/call-graph boundary gate only.
# proc-macro2 is the span type used by syn; pin the lockfile-compatible line.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
