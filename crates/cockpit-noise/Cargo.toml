[package]
name = "cockpit-noise"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:getrandom"]
native-bindings = ["dep:uniffi"]
test-entropy = []

[dependencies]
sha2 = { workspace = true }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
thiserror = { workspace = true }
zeroize = { workspace = true }
wasm-bindgen = { version = "=0.2.126", optional = true }
js-sys = { version = "=0.3.103", optional = true }
uniffi = { version = "=0.29.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"], optional = true }

[build-dependencies]
uniffi_build = "=0.29.4"
uniffi_bindgen = "=0.29.4"

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
