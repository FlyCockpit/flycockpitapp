[package]
name = "cockpit-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Ratatui terminal interface for the Cockpit CLI"
license = "Apache-2.0"
repository = "https://github.com/FlyCockpit/flycockpitapp"
homepage = "https://github.com/FlyCockpit/flycockpitapp"
publish = false

[lints]
workspace = true

[dependencies]
cockpit-config = { path = "../cockpit-config" }
cockpit-core = { path = "../cockpit-core" }
cockpit-proto = { path = "../cockpit-proto" }
cockpit-tokenizer = { path = "../cockpit-tokenizer" }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
ignore = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread", "macros", "process", "io-util", "fs",
    "net", "signal", "time", "sync",
] }
tracing = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
crossterm = { version = "0.29", features = ["event-stream"] }
notify-rust = "4.11"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
similar = { workspace = true }
tui-term = { version = "0.3", default-features = false, features = ["vt100"] }
vt100 = "0.16"


[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Pin matches crates/cockpit-config and crates/cockpit-core (see their
# Cargo.toml comments). Wdk_Storage_FileSystem/Wdk_Foundation are for the
# NtCreateFile handle-relative opens shared with cockpit-config's atomic
# writer; Win32_Security_Authorization is for the clipboard recovery
# artifact's explicit owner-only DACL (SetSecurityInfo/GetSecurityInfo/
# ConvertStringSecurityDescriptorToSecurityDescriptorW) and the `/copy file`
# atomic no-clobber publish's FileRenameInfoEx.
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
cockpit-config = { path = "../cockpit-config", features = ["test-support"] }
cockpit-core = { path = "../cockpit-core", features = ["test-support"] }
cockpit-test-support = { path = "../cockpit-test-support" }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
